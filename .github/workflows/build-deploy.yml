name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexmils/nura

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ] || [ -z "${COOLIFY_API_URL:-}" ]; then
            echo "Missing Coolify secrets (COOLIFY_TOKEN, COOLIFY_APP_UUID, COOLIFY_API_URL)"
            exit 1
          fi
          # Coolify expects uuid/force as query params (JSON body returns "You must provide uuid or tag").
          http_code="$(curl --silent --show-error --output /tmp/coolify-deploy.json --write-out '%{http_code}' \
            --request POST \
            --get \
            --data-urlencode "uuid=${COOLIFY_APP_UUID}" \
            --data-urlencode "force=true" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_API_URL%/}/api/v1/deploy" || true)"
          echo "Coolify deploy HTTP ${http_code}"
          cat /tmp/coolify-deploy.json || true
          echo
          if [ "${http_code}" = "401" ] || [ "${http_code}" = "403" ]; then
            echo "::error::Coolify auth failed (${http_code}). Rotate COOLIFY_TOKEN (Keys & Tokens) and update the GitHub secret."
            exit 22
          fi
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Coolify deploy failed with HTTP ${http_code}"
            exit 22
          fi

      - name: Wait for the Coolify rollout
        run: |
          # The Coolify deploy API returns when the rollout is queued, not when
          # the new container serves traffic. Purging now lets Cloudflare cache
          # the previous build's HTML; its asset hashes disappear with the old
          # container and visitors get a preloader stuck at 0%.
          sleep 120

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 5c6b45c42d512efa45c0fb7d8c851e6c
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache"
